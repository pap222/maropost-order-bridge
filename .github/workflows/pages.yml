# Publishes the shop floor planner (public/planner) to GitHub Pages.
# Independent of the Netlify site that serves the order bridge.
name: Deploy planner to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/planner/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/planner
      - id: deployment
        uses: actions/deploy-pages@v4
