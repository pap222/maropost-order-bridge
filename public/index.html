<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wagga Fruit Supply — Web Order Review</title>
<style>
  :root { --green:#2e7d32; --red:#c62828; --amber:#ef6c00; --bg:#f4f6f8; --line:#e0e0e0; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, Segoe UI, Roboto, sans-serif; margin:0; background:var(--bg); color:#222; }
  header { background:var(--green); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header .ctl { display:flex; align-items:center; gap:8px; font-size:14px; }
  header .ctl.auto { background:rgba(0,0,0,.18); padding:6px 10px; border-radius:6px; }
  button { cursor:pointer; border:none; border-radius:6px; padding:8px 14px; font-size:14px; font-weight:600; }
  button.primary { background:#fff; color:var(--green); }
  button.push { background:var(--green); color:#fff; }
  button.pushall { background:#1565c0; color:#fff; }
  button.saveall { background:#607d8b; color:#fff; }
  button.invoice { background:#455a64; color:#fff; }
  button.refund { background:#ad1457; color:#fff; }
  button.ready { background:#00897b; color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .tabs { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .tabs button { background:#fff; color:#555; border:1px solid var(--line); }
  .tabs button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .tabs button .tcount { font-size:11px; opacity:.8; margin-left:4px; }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:18px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size:16px; margin:0; padding:12px 16px; background:#fafafa; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .cust { font-size:13px; color:#555; padding:8px 16px; border-bottom:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 16px; border-bottom:1px solid #f0f0f0; }
  th { color:#888; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  tr.unmapped td { background:#fff8e1; }
  tr.navail td { background:#ffebee; }
  tr.navail td b { text-decoration:line-through; color:#b71c1c; }
  label.avail { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:#c62828; font-weight:600; white-space:nowrap; }
  input.naqty { width:54px; text-align:center; border-color:#e0a0a0; }
  input.naqty.on { background:#ffebee; font-weight:700; color:#b71c1c; }
  .naof { color:#999; font-weight:400; }
  input.code { width:90px; text-transform:uppercase; }
  input.qbpick { width:230px; }
  .qbdesc { font-size:11px; margin-top:3px; color:var(--green); }
  .qbdesc.bad { color:var(--red); font-weight:600; }
  input.factor { width:64px; }
  input.factor.diff { border-color:var(--red); color:var(--red); font-weight:700; background:#ffebee; }
  input { padding:5px 7px; border:1px solid #ccc; border-radius:5px; font-size:13px; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .badge.synced { background:#e8f5e9; color:var(--green); }
  .badge.unmapped { background:#fff3e0; color:var(--amber); }
  .badge.na { background:#ffebee; color:var(--red); }
  .badge.date { background:#e3f2fd; color:#1565c0; font-size:13px; }
  .actions { padding:12px 16px; display:flex; gap:10px; align-items:center; }
  .save { background:#eee; color:#333; padding:5px 10px; font-size:12px; }
  .msg { font-size:13px; }
  .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
  #log { white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:12px; background:#111; color:#9fe; padding:12px; border-radius:8px; max-height:200px; overflow:auto; }
  #gate { max-width:360px; margin:80px auto; background:#fff; padding:24px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .out { font-weight:700; }
  small.note { color:#999; }
</style>
</head>
<body>
<div id="gate" style="display:none">
  <h2 style="margin-top:0">Web Order Review — login</h2>
  <p style="font-size:13px;color:#666">Enter the shared password.</p>
  <input id="pw" type="password" style="width:100%;padding:10px" placeholder="password" />
  <button class="push" style="width:100%;margin-top:12px" onclick="login()">Enter</button>
  <p id="gateErr" class="msg err"></p>
</div>

<div id="app" style="display:none">
<header>
  <h1>🍎 Web Order Review</h1>
  <label class="ctl"><input type="checkbox" id="testMode" checked /> Test mode (no real order)</label>
  <label class="ctl auto"><input type="checkbox" id="autoMode" onchange="saveAuto(this)" /> <b>Automate</b> (cron pushes every 5 min)</label>
  <span id="autoState" class="ctl"></span>
  <button class="primary" onclick="loadOrders()">↻ Reload</button>
  <button class="pushall" onclick="pushAll()">Push all confirmed</button>
  <button class="primary" onclick="logout()">Logout</button>
</header>
<datalist id="qbList"></datalist>
<main>
  <div class="tabs" id="tabs">
    <button data-view="active"   class="on" onclick="switchView('active')">📋 To process</button>
    <button data-view="delivery" onclick="switchView('delivery')">🚚 Deliveries (ready)</button>
    <button data-view="pickup"   onclick="switchView('pickup')">🏪 Pickups (ready)</button>
    <button data-view="completed" onclick="switchView('completed')">✅ Completed</button>
  </div>
  <div id="orders"></div>
  <h3>Activity log</h3>
  <div id="log"></div>
</main>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
let TOKEN = sessionStorage.getItem("rt") || "";

function log(msg, cls="") { const el=$("#log"); el.textContent += (cls==="err"?"✗ ":"• ")+msg+"\n"; el.scrollTop=el.scrollHeight; }

function show(view){ $("#gate").style.display = view==="gate"?"block":"none"; $("#app").style.display = view==="app"?"block":"none"; }
function login(){ TOKEN=$("#pw").value; sessionStorage.setItem("rt",TOKEN); show("app"); loadOrders(); }
function logout(){ sessionStorage.removeItem("rt"); TOKEN=""; show("gate"); }

async function api(path, opts={}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type":"application/json", "x-review-token":TOKEN, ...(opts.headers||{}) } });
  if (res.status===401){ logout(); $("#gateErr").textContent="Wrong password"; throw new Error("unauthorized"); }
  return res.json();
}

function testMode(){ return $("#testMode").checked; }

// --- QuickB2B catalogue (static snapshot: public/qb2b-items.json) ----------
let QBITEMS = null; // Map code -> name
async function loadQbItems(){
  if(QBITEMS) return;
  try{
    const arr = await (await fetch("/qb2b-items.json")).json();
    QBITEMS = new Map(arr.map(i=>[i.code, i.name]));
    $("#qbList").innerHTML = arr.map(i=>`<option value="${esc(i.name)} — ${esc(i.code)}"></option>`).join("");
  }catch(e){ QBITEMS = new Map(); log("Could not load QuickB2B catalogue: "+e.message,"err"); }
}
const QBNAME = code => (QBITEMS && code) ? (QBITEMS.get(code) || QBITEMS.get(String(code).toUpperCase()) || null) : null;
function pickVal(code){ if(!code) return ""; const n=QBNAME(code); return n ? `${n} — ${code}` : code; }
function qbDescDiv(code){
  if(!code) return '<div class="qbdesc bad">— pick an item —</div>';
  const n=QBNAME(code);
  return n ? `<div class="qbdesc">${esc(n)}</div>` : `<div class="qbdesc bad">⚠ ${esc(code)} not in catalogue</div>`;
}
// The picker value looks like "Apple Granny Smith 1kg — 101"; the real code is
// after the last " — ". Plain typed text is treated as a code.
function codeFromPick(val){ const s=String(val||"").trim(); if(!s) return ""; const i=s.lastIndexOf(" — "); return (i>=0 ? s.slice(i+3) : s).trim().toUpperCase(); }
function onPick(inp){
  const code = codeFromPick(inp.value);
  const desc = inp.parentElement.querySelector(".qbdesc");
  if(!code){ desc.className="qbdesc bad"; desc.textContent="— pick an item —"; return; }
  const n = QBNAME(code);
  if(n){ desc.className="qbdesc"; desc.textContent=n; }
  else { desc.className="qbdesc bad"; desc.textContent="⚠ "+code+" not in catalogue"; }
}

async function loadAuto(){
  try{
    const r = await api("/api/settings");
    if(typeof r.auto_mode==="boolean") setAutoUI(r.auto_mode);
  }catch(e){ /* ignore on boot */ }
}
function setAutoUI(on){
  $("#autoMode").checked = on;
  const s=$("#autoState");
  s.textContent = on ? "● automation ON" : "○ manual review";
  s.style.color = on ? "#ffd54f" : "rgba(255,255,255,.7)";
  s.style.fontWeight = on ? "700" : "400";
}
async function saveAuto(cb){
  const on = cb.checked;
  if(on && !confirm("Turn ON automation?\n\nThe cron will push paid web orders to QuickB2B every 5 minutes with NO manual review.\n\n(Reminder: also confirm Test mode is set the way you want on the server.)")){
    cb.checked=false; return;
  }
  try{
    const r = await api("/api/settings",{ method:"POST", body: JSON.stringify({ auto_mode:on }) });
    if(r.ok){ setAutoUI(r.auto_mode); log(`Automation ${r.auto_mode?"ENABLED":"disabled"}`); }
    else { log("Failed to change automation: "+(r.error||"?"),"err"); cb.checked=!on; }
  }catch(e){ if(e.message!=="unauthorized"){ log("Failed to change automation: "+e.message,"err"); cb.checked=!on; } }
}

// Which board we're looking at: active | delivery | pickup | completed.
let VIEW = "active";
function switchView(view){
  VIEW = view;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view===view));
  loadOrders();
}

async function loadOrders(){
  $("#orders").innerHTML = "<p>Loading…</p>";
  loadAuto();
  if(VIEW==="completed") return loadCompleted();
  await loadQbItems();
  const empties = {
    active:   "No paid Website orders waiting. 🎉",
    delivery: "No deliveries marked ready. 🚚",
    pickup:   "No pickups marked ready. 🏪",
  };
  try {
    const qs = VIEW==="active" ? "" : `?view=${encodeURIComponent(VIEW)}`;
    const data = await api("/api/orders"+qs);
    if (data.error){ $("#orders").innerHTML = "<p class='msg err'>"+data.error+"</p>"; return; }
    if (!data.orders.length){ $("#orders").innerHTML = "<p>"+(empties[VIEW]||"Nothing here.")+"</p>"; return; }
    data.orders.forEach(o => { ORDERS[o.order_id] = o; });
    $("#orders").innerHTML = data.orders.map(renderCard).join("");
    log(`Loaded ${data.orders.length} ${VIEW} orders`);
  } catch(e){ if(e.message!=="unauthorized") $("#orders").innerHTML="<p class='msg err'>"+e.message+"</p>"; }
}

// Completed tab: a simple rolling list (auto-cleared weekly server-side).
async function loadCompleted(){
  $("#orders").innerHTML = "<p>Loading…</p>";
  try {
    const data = await api("/api/completed");
    if (data.error){ $("#orders").innerHTML = "<p class='msg err'>"+data.error+"</p>"; return; }
    if (!data.orders.length){ $("#orders").innerHTML = "<p>Nothing completed in the last 7 days.</p>"; return; }
    const rows = data.orders.map(o => `
      <tr>
        <td><b>#${esc(o.order_id)}</b></td>
        <td>${o.mode==="pickup"?"🏪 Pickup":"🚚 Delivery"}</td>
        <td>${esc(o.status||"")}</td>
        <td>${esc(o.customer||"")}</td>
        <td>${esc(o.shipping||"")}</td>
        <td>${money(o.total||0)}</td>
        <td>${esc(fmtWhen(o.fulfilled_at))}</td>
      </tr>`).join("");
    $("#orders").innerHTML = `<div class="card"><table>
      <thead><tr><th>Order</th><th>Type</th><th>Status</th><th>Customer</th><th>Shipping</th><th>Total</th><th>Marked ready</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="cust">These rows clear automatically after 7 days — the real record stays in Maropost.</div>
    </div>`;
    log(`Loaded ${data.orders.length} completed orders`);
  } catch(e){ if(e.message!=="unauthorized") $("#orders").innerHTML="<p class='msg err'>"+e.message+"</p>"; }
}
function fmtWhen(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":d.toLocaleString("en-AU",{timeZone:"Australia/Sydney",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }

// Maropost's invoice printout can't be deep-linked (it's a session/POST page),
// so we generate a clean print-ready invoice from the order data and auto-print
// it. Orders are cached here by id when the list loads.
const ORDERS = {};
const money = n => "$" + (Number(n)||0).toFixed(2);

// Render an address block ({name, company, phone, lines[]}) to HTML, falling
// back to the order's customer info when the structured block is empty.
function addrHTML(b, fallback){
  b = b || {};
  const parts = [];
  const name = b.name || (fallback && fallback.name) || "";
  if(name) parts.push(`<b>${esc(name)}</b>`);
  if(b.company && b.company!==name) parts.push(esc(b.company));
  (b.lines||[]).forEach(l=>{ if(l) parts.push(esc(l)); });
  if(b.phone) parts.push("Ph: "+esc(b.phone));
  if(fallback && fallback.email) parts.push(esc(fallback.email));
  return parts.length ? parts.join("<br>") : '<span class="muted">—</span>';
}

function invoiceHTML(o){
  const c = o.customer || {};
  const isPickup = /pick\s*-?\s*up/i.test(o.shipping||"");
  const rows = o.lines.map(l=>{
    const na = Number(l.na_qty)||0;
    const whole = na>0 && na>=Number(l.ordered_qty);
    const tag = na<=0 ? "" : whole
      ? ' <span class="natag">NOT AVAILABLE</span>'
      : ` <span class="natag">${na} of ${l.ordered_qty} N/A</span>`;
    return `
    <tr class="${whole?'na':''}"><td class="r">${l.ordered_qty}</td>
    <td>${esc(l.product_name||l.sku)}${tag}</td>
    <td class="r">${money(l.unit_price)}</td><td class="r">0.00%</td><td class="r">${money(l.line_total)}</td></tr>`;
  }).join("");
  const refund = Number(o.refund_total||0);

  // Totals breakdown mirrors Maropost's Tax Invoice: product subtotal, shipping,
  // 2.2% card surcharge, GST (already included in the prices), grand total, then
  // amount paid / balance due.
  const surchargeLabel = (o.surcharge_total>0 && o.product_subtotal>0)
    ? `Surcharge (${(o.surcharge_total/(o.product_subtotal+(o.shipping_total||0))*100).toFixed(2)}%)`
    : "Surcharge";
  const totalRow = (label, val, cls="") =>
    `<tr class="${cls}"><td colspan="4" class="r">${label}</td><td class="r">${money(val)}</td></tr>`;
  const foot = [
    totalRow("Product Subtotal", o.product_subtotal),
    (o.shipping_total>0) ? totalRow(esc(o.shipping||"Shipping"), o.shipping_total) : "",
    (o.surcharge_total>0) ? totalRow(surchargeLabel, o.surcharge_total) : "",
    totalRow(`GST (included)`, o.gst),
    totalRow("Grand Total", o.grand_total, "tot"),
    totalRow("Amount Paid", o.amount_paid),
    totalRow("Balance Due", o.balance_due, o.balance_due>0.001?"due":""),
    (refund>0) ? `<tr class="due"><td colspan="4" class="r">Less unavailable items (refunded)</td><td class="r">-${money(refund)}</td></tr>` : "",
    (refund>0) ? totalRow("Adjusted Total", Number((o.grand_total-refund).toFixed(2)), "tot") : "",
  ].join("");

  const payRows = (o.payments||[]).map(p=>`
    <tr><td>${esc(p.date||'')}</td><td>${esc(p.method||'')}</td><td class="r">${money(p.amount)}</td></tr>`).join("");

  return `<!doctype html><html><head><meta charset="utf-8"><title>Invoice ${esc(o.order_id)}</title>
  <style>
    *{font-family:Arial,Helvetica,sans-serif;box-sizing:border-box;}
    body{margin:24px;color:#111;font-size:13px;}
    h1{margin:0;font-size:24px;} .tax{font-size:18px;color:#444;margin:2px 0;}
    .abn{font-size:12px;color:#666;}
    .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px;}
    .meta{text-align:right;line-height:1.6;}
    .meta .inv{font-size:16px;font-weight:bold;}
    .paid{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:12px;}
    .paid.yes{background:#1b8a3a;color:#fff;} .paid.no{background:#c62828;color:#fff;}
    .mode{display:inline-block;margin:14px 0 4px;padding:5px 12px;border:2px solid #111;border-radius:4px;font-weight:bold;font-size:15px;}
    .cols{display:flex;gap:24px;margin:12px 0;}
    .col{flex:1;} .col h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;color:#666;letter-spacing:.5px;}
    .col .body{line-height:1.5;}
    .instr{margin:8px 0 14px;padding:8px 12px;background:#fff8e1;border:1px solid #ffe082;border-radius:4px;}
    .instr b{display:block;font-size:11px;text-transform:uppercase;color:#8a6d00;margin-bottom:2px;}
    table{width:100%;border-collapse:collapse;margin-top:6px;}
    th,td{padding:7px 8px;border-bottom:1px solid #ddd;text-align:left;} th{background:#f3f3f3;}
    .r{text-align:right;} .muted{color:#999;}
    tr.na td{text-decoration:line-through;color:#b71c1c;}
    .natag{text-decoration:none;display:inline-block;margin-left:6px;font-size:10px;font-weight:bold;color:#fff;background:#c62828;padding:1px 5px;border-radius:3px;vertical-align:middle;}
    tfoot td{border-bottom:none;padding:4px 8px;}
    tfoot .tot td{font-weight:bold;font-size:15px;border-top:2px solid #111;padding-top:8px;}
    tfoot .due td{font-weight:bold;color:#c62828;}
    .pay{margin-top:18px;} .pay h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;color:#666;}
    .pay table{font-size:12px;} .pay td,.pay th{padding:5px 8px;}
    .foot{margin-top:18px;font-size:11px;color:#888;}
    @media print{body{margin:0;}}
  </style></head><body>
    <div class="top">
      <div>
        <h1>${esc(o.business?.name||'Wagga Fruit Supply')}</h1>
        <div class="tax">Tax Invoice</div>
        ${o.business?.abn?`<div class="abn">ABN ${esc(o.business.abn)}</div>`:''}
      </div>
      <div class="meta">
        <div class="inv">Invoice #${esc(o.order_id)}</div>
        ${o.date_placed?`<div>Date placed: ${esc(o.date_placed)}</div>`:''}
        ${o.date_invoiced?`<div>Date invoiced: ${esc(o.date_invoiced)}</div>`:''}
        <div><span class="paid ${o.paid?'yes':'no'}">${o.paid?'PAID':'UNPAID'}</span></div>
      </div>
    </div>

    <div class="mode">${isPickup?'PICK UP':'DELIVERY'}${o.required_date?` &mdash; ${esc(o.required_date)}`:''}</div>

    <div class="cols">
      <div class="col"><h3>${isPickup?'Customer (Pick Up)':'Ship To'}</h3>
        <div class="body">${isPickup?'<b>PICK UP</b><br>'+addrHTML({name:o.ship_to?.name,company:o.ship_to?.company,phone:o.ship_to?.phone},c):addrHTML(o.ship_to,c)}</div></div>
      <div class="col"><h3>Billed To</h3>
        <div class="body">${addrHTML(o.bill_to,c)}</div></div>
    </div>

    ${o.instructions?`<div class="instr"><b>Delivery instructions</b>${esc(o.instructions)}</div>`:''}

    <table>
      <thead><tr><th class="r">Qty</th><th>Item</th><th class="r">Unit Price</th><th class="r">Tax</th><th class="r">Subtotal</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot>${foot}</tfoot>
    </table>

    ${payRows?`<div class="pay"><h3>Payments</h3>
      <table><thead><tr><th>Date</th><th>Method</th><th class="r">Amount</th></tr></thead>
      <tbody>${payRows}</tbody></table></div>`:''}

    <div class="foot">Web order #${esc(o.order_id)} &middot; printed for packing/dispatch. Prices include GST where applicable.</div>
  </body></html>`;
}

function openInvoice(orderId){
  const o = ORDERS[orderId];
  if(!o){ alert("Reload the page, then try Invoice again."); return; }
  const w = window.open("", "wfs_invoice_"+orderId);
  if(!w){ alert("Pop-up blocked — allow pop-ups for this site to print invoices."); return; }
  w.document.open(); w.document.write(invoiceHTML(o)); w.document.close(); w.focus();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 350);
}

function renderCard(o){
  const rows = o.lines.map((l,i)=>`
    <tr class="${l.mapped?'':'unmapped'} ${l.unavailable?'navail':''}" data-sku="${esc(l.sku)}">
      <td><b>${esc(l.product_name||l.sku)}</b></td>
      <td>${l.ordered_qty}</td>
      <td>
        <input class="qbpick" list="qbList" value="${esc(pickVal(l.qb_code))}" oninput="onPick(this)" placeholder="search name or code" />
        ${qbDescDiv(l.qb_code)}
      </td>
      <td><input class="factor${l.factor!=1?' diff':''}" type="number" step="0.001" value="${l.factor}" oninput="markFactor(this)" /></td>
      <td class="out">${l.out_qty==null?'<span class="badge unmapped">unmapped</span>':l.out_qty}</td>
      <td><label class="avail" title="How many units are NOT available (short supply) — these get refunded">N/A
        <input class="naqty${l.na_qty>0?' on':''}" type="number" min="0" max="${l.ordered_qty}" step="0.001" value="${l.na_qty||0}" onchange="setNaQty(this,'${esc(o.order_id)}')" />
        <span class="naof">of ${l.ordered_qty}</span></label></td>
      <td><button class="save" onclick="saveMap(this)">Save</button> <span class="msg"></span></td>
    </tr>`).join("");
  const c=o.customer;
  return `<div class="card" data-order="${esc(o.order_id)}">
    <h2>#${esc(o.order_id)}
      ${o.required_date?`<span class="badge date">📅 wants ${esc(o.required_date)}</span>`:''}
      ${o.synced?'<span class="badge synced">already pushed</span>':''}
      ${o.unmapped_count?`<span class="badge unmapped">${o.unmapped_count} unmapped</span>`:''}
      <span class="badge na nacount" ${o.unavailable_count?'':'style="display:none"'}>${o.unavailable_count||0} short</span>
    </h2>
    <div class="cust"><b>${esc(c.name)}</b> &nbsp; ${esc(c.phone||'')} &nbsp; ${esc(c.address||'')} ${c.email&&c.email!==c.name?`&nbsp; <span class="note">${esc(c.email)}</span>`:''}${o.shipping?` &nbsp;·&nbsp; <b>${esc(o.shipping)}</b>`:''}</div>
    <table>
      <thead><tr><th>Product</th><th>Ordered</th><th>QuickB2B item</th><th>× factor</th><th>= qty</th><th>Stock</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="actions">
      ${VIEW==="active" ? `
      <button class="saveall" onclick="saveAll('${esc(o.order_id)}', this)">Save all mappings</button>
      <button class="push" onclick="pushOne('${esc(o.order_id)}', this)" ${o.synced?'disabled':''}>Confirm & Push</button>` : ''}
      <button class="invoice" onclick="openInvoice('${esc(o.order_id)}')">🖨 Invoice</button>
      <button class="refund" onclick="doRefund('${esc(o.order_id)}', this)" ${o.refund_total>0?'':'disabled'}>↩ Refund <span class="ramt">${money(o.refund_total||0)}</span></button>
      ${VIEW==="active" ? `
      <button class="ready" onclick="markReady('${esc(o.order_id)}', this)">${isPickupShip(o.shipping)?'🏪 Ready for pickup':'🚚 Mark dispatched'}</button>` : ''}
      <span class="msg"></span>
    </div>
  </div>`;
}

// Save one row's mapping. In batch mode it skips the per-row confirm popup.
async function saveRow(tr, { batch=false } = {}){
  const sku = tr.dataset.sku;
  const code = codeFromPick($(".qbpick",tr).value);
  const factor = parseFloat($(".factor",tr).value)||1;
  const msg = tr.querySelector(".msg");
  if(!code){ if(msg){ msg.textContent="pick an item"; msg.className="msg err"; } return { ok:false, empty:true }; }
  if(!batch && !QBNAME(code) && !confirm(`"${code}" isn't in the QuickB2B catalogue.\nSave it anyway?`)){ return { ok:false, skipped:true }; }
  if(msg){ msg.textContent="…"; msg.className="msg"; }
  try{
    const r = await api("/api/save-mapping",{ method:"POST", body: JSON.stringify({ maropost_sku:sku, qb2b_item_code:code, qty_factor:factor }) });
    if(r.ok){
      if(msg){ msg.textContent="saved"; msg.className="msg ok"; }
      tr.classList.remove("unmapped");
      $(".out",tr).textContent = +( (parseFloat(tr.children[1].textContent)||1)*factor ).toFixed(3);
      log(`Saved ${sku} → ${code} ×${factor}`);
      return { ok:true };
    } else { if(msg){ msg.textContent=r.error||"error"; msg.className="msg err"; } return { ok:false, error:r.error }; }
  }catch(e){ if(e.message!=="unauthorized" && msg){ msg.textContent=e.message; msg.className="msg err"; } return { ok:false, error:e.message }; }
}

async function saveMap(btn){ await saveRow(btn.closest("tr")); }

async function saveAll(orderId, btn){
  const card = btn.closest(".card");
  const rows = [...card.querySelectorAll("tbody tr")];
  const msg = $(".msg", btn.parentElement);
  msg.textContent="saving all…"; msg.className="msg"; btn.disabled=true;
  let ok=0, fail=0;
  for(const tr of rows){
    const r = await saveRow(tr, { batch:true });
    if(r.ok) ok++; else if(!r.empty) fail++;
  }
  msg.textContent = `saved ${ok}${fail?`, ${fail} failed`:""}`;
  msg.className = fail ? "msg err" : "msg ok";
  btn.disabled=false;
  log(`#${orderId} Save all → ${ok} saved${fail?`, ${fail} failed`:""}`);
}

async function pushOne(orderId, btn, opts={}){
  const msg = $(".msg", btn.parentElement); msg.textContent="pushing…"; msg.className="msg"; btn.disabled=true;
  try{
    const r = await api("/api/push-order",{ method:"POST", body: JSON.stringify({ orderId, testMode: testMode() }) });
    if(r.ok){
      msg.textContent = r.already ? "already pushed" : (testMode()? "TEST ok ✓" : "pushed ✓");
      msg.className="msg ok";
      log(`#${orderId} ${r.already?'already synced':(testMode()?'TEST pushed':'PUSHED')}${r.unmapped&&r.unmapped.length?' (flagged: '+r.unmapped.join(', ')+')':''}`);
      // Pop the Maropost invoice for printing. Skipped during "Push all" (browsers
      // block many pop-ups at once) — use the per-order 🖨 Invoice button there.
      if(!opts.fromAll && !r.already) openInvoice(orderId);
      const badge=document.createElement("span"); badge.className="badge synced"; badge.textContent="already pushed";
      $(".card[data-order='"+cssEsc(orderId)+"'] h2").appendChild(badge);
    } else {
      msg.textContent = r.message||r.error||"failed"; msg.className="msg err"; btn.disabled=false;
      log(`#${orderId} FAILED: ${r.message||r.error}`,"err");
    }
  }catch(e){ if(e.message!=="unauthorized"){ msg.textContent=e.message; msg.className="msg err"; btn.disabled=false; } }
}

async function pushAll(){
  const cards=[...document.querySelectorAll(".card")];
  for(const card of cards){
    const btn=$(".push",card);
    if(btn && !btn.disabled){ await pushOne(card.dataset.order, btn, {fromAll:true}); }
  }
}

// --- "not available" (short supply) + Stripe refund -----------------------
// Set how many units of a line are not available. Refund = those units' value.
async function setNaQty(inp, orderId){
  const tr = inp.closest("tr");
  const sku = tr.dataset.sku;
  const o = ORDERS[orderId];
  const ln = o && o.lines.find(x=>String(x.sku)===String(sku));
  const ordered = ln ? Number(ln.ordered_qty)||0 : Infinity;
  let qty = Number(inp.value)||0;
  if(qty<0) qty=0;
  if(qty>ordered) qty=ordered;
  inp.value = qty;
  inp.classList.toggle("on", qty>0);
  tr.classList.toggle("navail", qty>0);
  try{
    const r = await api("/api/set-unavailable",{ method:"POST", body: JSON.stringify({ orderId, sku, qty }) });
    if(r.ok){
      if(ln){ ln.na_qty=qty; ln.unavailable=qty>0; ln.refund_line=Number((qty*(Number(ln.unit_price)||0)).toFixed(2)); }
      refreshRefundUI(orderId);
      log(`#${orderId} ${sku}: ${qty>0?qty+" not available":"all available"}`);
    } else {
      log(`Failed to update ${sku}: ${r.error||"?"}`,"err");
    }
  }catch(e){ if(e.message!=="unauthorized"){ log(e.message,"err"); } }
}

// Recompute the refund total from the cached lines and refresh the button + badge.
function refreshRefundUI(orderId){
  const o = ORDERS[orderId]; if(!o) return;
  const naLines = o.lines.filter(l=>Number(l.na_qty)>0);
  o.refund_total = Number(naLines.reduce((s,l)=>s+(Number(l.refund_line)||0),0).toFixed(2));
  o.unavailable_count = naLines.length;
  const card = document.querySelector(".card[data-order='"+cssEsc(orderId)+"']");
  if(!card) return;
  const btn = card.querySelector("button.refund");
  if(btn){ btn.disabled = !(o.refund_total>0); const amt=btn.querySelector(".ramt"); if(amt) amt.textContent=money(o.refund_total); }
  const badge = card.querySelector(".nacount");
  if(badge){ badge.textContent = `${o.unavailable_count} short`; badge.style.display = o.unavailable_count? "" : "none"; }
}

async function doRefund(orderId, btn){
  const o = ORDERS[orderId];
  const total = o ? Number(o.refund_total||0) : 0;
  if(!(total>0)){ alert("Enter a not-available quantity on at least one line first."); return; }
  const items = o.lines.filter(l=>Number(l.na_qty)>0).map(l=>`• ${l.na_qty} × ${(l.product_name||l.sku)}  ${money(l.refund_line)}`).join("\n");
  if(!confirm(`Refund ${money(total)} to the customer via Stripe?\n\nOrder #${orderId} — short supply:\n${items}\n\n⚠ This sends REAL money back to the customer. Continue?`)) return;
  const msg = $(".msg", btn.parentElement); msg.textContent="refunding…"; msg.className="msg"; btn.disabled=true;
  try{
    const r = await api("/api/refund",{ method:"POST", body: JSON.stringify({ orderId }) });
    if(r.ok){
      msg.textContent = r.already ? `already refunded ${money(r.refunded)}` : `refunded ${money(r.refunded)} ✓`;
      msg.className="msg ok";
      log(`#${orderId} REFUNDED ${money(r.refunded)}${r.stripe_refund_id?" ("+r.stripe_refund_id+")":""}${r.already?" [already]":""}`);
    } else {
      msg.textContent = r.message||r.error||"failed"; msg.className="msg err"; btn.disabled=false;
      log(`#${orderId} REFUND FAILED: ${r.message||r.error}`,"err");
    }
  }catch(e){ if(e.message!=="unauthorized"){ msg.textContent=e.message; msg.className="msg err"; btn.disabled=false; } }
}

// Pickup vs delivery from the shipping label (mirrors the server's isPickup).
function isPickupShip(ship){ return /pick\s*-?\s*up/i.test(String(ship||"")); }

// "Mark ready": change the Maropost status (Dispatched / Pending Pickup), which
// fires the customer SMS, then drop the card off the active board.
async function markReady(orderId, btn){
  const o = ORDERS[orderId];
  const pickup = isPickupShip(o && o.shipping);
  const verb = pickup ? "ready for pickup (Pending Pickup)" : "dispatched (Dispatched)";
  if(o && o.synced===false && !confirm(`Order #${orderId} hasn't been pushed to QuickB2B yet.\nMark it ${verb} anyway?`)) return;
  else if(!(o && o.synced===false) && !confirm(`Mark order #${orderId} as ${verb}?\n\nThis changes the Maropost status and sends the customer an SMS, then removes it from this list.`)) return;
  const msg = $(".msg", btn.parentElement); msg.textContent="updating…"; msg.className="msg"; btn.disabled=true;
  try{
    const r = await api("/api/mark-ready",{ method:"POST", body: JSON.stringify({ orderId }) });
    if(r.ok){
      log(`#${orderId} marked ${r.mode==="pickup"?"Pending Pickup":"Dispatched"} → SMS sent`);
      const card = document.querySelector(".card[data-order='"+cssEsc(orderId)+"']");
      if(card){ card.style.transition="opacity .3s"; card.style.opacity="0"; setTimeout(()=>{ card.remove(); if(!$("#orders").querySelector(".card")) $("#orders").innerHTML="<p>No paid Website orders waiting. 🎉</p>"; }, 300); }
    } else {
      msg.textContent = r.error||"failed"; msg.className="msg err"; btn.disabled=false;
      log(`#${orderId} MARK READY FAILED: ${r.error}`,"err");
    }
  }catch(e){ if(e.message!=="unauthorized"){ msg.textContent=e.message; msg.className="msg err"; btn.disabled=false; } }
}

function markFactor(inp){ const v=parseFloat(inp.value); inp.classList.toggle('diff', !isNaN(v) && v!==1); }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssEsc = s => String(s).replace(/'/g,"\\'");

// boot
if(TOKEN){ show("app"); loadOrders(); } else { show("gate"); }
</script>
